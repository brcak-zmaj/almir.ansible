---
# Handlers for OliveTin role

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Restart olivetin service
  ansible.builtin.systemd:
    name: OliveTin
    state: restarted
  become: true
  when: olivetin_install_method == 'package'

- name: Restart olivetin container
  community.docker.docker_container:
    name: "{{ olivetin_docker_container_name }}"
    state: started
    restart: true
  become: false
  when: olivetin_install_method == 'docker'
  tags:
    - docker
    - olivetin
