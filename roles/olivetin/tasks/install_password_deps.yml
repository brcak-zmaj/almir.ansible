---
# Install Python dependencies for password hashing via package manager.
# Runs on the TARGET host (not the control node) — the hashing task in
# users.yml executes there too.

- name: Install Python password hashing dependencies (RedHat)
  ansible.builtin.package:
    name:
      - python3-passlib
      - python3-argon2-cffi
    state: present
  become: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install Python password hashing dependencies (Debian)
  ansible.builtin.package:
    name:
      - python3-passlib
      - python3-argon2
    state: present
  become: true
  when: ansible_facts['os_family'] == 'Debian'
