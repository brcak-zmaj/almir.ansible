---
# =============================================================================
# NUT Service Management Tasks
# =============================================================================

- name: Enable and start NUT driver service
  ansible.builtin.systemd:
    name: "{{ nut_driver_service }}"
    enabled: "{{ nut_services_enabled | bool }}"
    state: "{{ 'started' if nut_services_started | bool else 'stopped' }}"
    daemon_reload: true
  when: nut_mode in ['standalone', 'netserver']
  tags:
    - nut
    - nut-service

- name: Enable and start NUT server service
  ansible.builtin.systemd:
    name: "{{ nut_server_service }}"
    enabled: "{{ nut_services_enabled | bool }}"
    state: "{{ 'started' if nut_services_started | bool else 'stopped' }}"
    daemon_reload: true
  when: nut_mode in ['standalone', 'netserver']
  tags:
    - nut
    - nut-service

- name: Enable and start NUT monitor service
  ansible.builtin.systemd:
    name: "{{ nut_monitor_service }}"
    enabled: "{{ nut_services_enabled | bool }}"
    state: "{{ 'started' if nut_services_started | bool else 'stopped' }}"
    daemon_reload: true
  when: nut_mode != 'none'
  tags:
    - nut
    - nut-service

# Query every configured UPS. Falls back to nut_ups_name for the single-UPS
# form, so the reported name always matches what was actually written to
# ups.conf rather than the nut_ups_name default.
- name: Display UPS status
  ansible.builtin.command: upsc {{ item }}@localhost
  loop: >-
    {{ nut_ups_devices | map(attribute='name') | list
       if (nut_ups_devices | length > 0)
       else [nut_ups_name] }}
  loop_control:
    label: "{{ item }}"
  register: nut_ups_status
  changed_when: false
  failed_when: false
  when:
    - nut_mode in ['standalone', 'netserver']
    - nut_services_started | bool
  tags:
    - nut
    - nut-service

- name: Show UPS status
  ansible.builtin.debug:
    msg: "{{ item.item }}: {{ item.stdout_lines | default(['UPS status not available']) }}"
  loop: "{{ nut_ups_status.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - nut_mode in ['standalone', 'netserver']
    - nut_services_started | bool
    - item.rc is defined
    - item.rc == 0
  tags:
    - nut
    - nut-service
