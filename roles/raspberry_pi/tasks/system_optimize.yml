---
# System Optimizations

- name: Check if noatime is already configured for root mount
  ansible.builtin.shell:
    cmd: grep -E '^(LABEL=|UUID=|/dev/)[^[:space:]]+[[:space:]]+/[[:space:]]+ext4' /etc/fstab | grep -q noatime
  register: noatime_check
  changed_when: false
  failed_when: false

- name: Configure filesystem mount options with noatime
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^((LABEL=|UUID=|/dev/)[^\s]+\s+/\s+ext4\s+)(\S+)(\s+\d+\s+\d+)$'
    replace: '\1\3,noatime\4'
  when:
    - rpi_fs_noatime | bool
    - noatime_check.rc != 0

# Consolidated VM tuning (swappiness, vfs_cache_pressure, dirty writeback).
# Written to /etc/sysctl.d/ rather than /etc/sysctl.conf: on modern systemd
# (v256+), systemd-sysctl.service - the unit that applies sysctls at boot -
# only reads /etc/sysctl.d/*.conf, /run/sysctl.d/*.conf and
# /usr/lib/sysctl.d/*.conf. It does not read /etc/sysctl.conf, so settings
# written there are silently lost on every reboot even though they remain
# correct in the file.
- name: Configure VM tuning (swappiness, cache pressure, dirty writeback)
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.d/99-rpi-optimize.conf
    owner: root
    group: root
    mode: '0644'
  notify: reload sysctl

- name: Configure CPU governor
  ansible.builtin.apt:
    name: cpufrequtils
    state: present
  when: rpi_cpu_governor is defined

- name: Set CPU governor
  ansible.builtin.lineinfile:
    path: /etc/default/cpufrequtils
    regexp: "^GOVERNOR="
    line: "GOVERNOR={{ rpi_cpu_governor }}"
    state: present
    create: true
    owner: root
    group: root
    mode: '0644'
  when: rpi_cpu_governor is defined

- name: Configure CPU min frequency
  ansible.builtin.lineinfile:
    path: /etc/default/cpufrequtils
    regexp: "^MIN_SPEED="
    line: "MIN_SPEED={{ rpi_cpu_min_freq }}"
    state: present
    create: true
    owner: root
    group: root
    mode: '0644'
  when: rpi_cpu_min_freq is defined

- name: Configure CPU max frequency
  ansible.builtin.lineinfile:
    path: /etc/default/cpufrequtils
    regexp: "^MAX_SPEED="
    line: "MAX_SPEED={{ rpi_cpu_max_freq if rpi_cpu_max_freq | int > 0 else '' }}"
    state: present
    create: true
    owner: root
    group: root
    mode: '0644'
  when: rpi_cpu_max_freq is defined and rpi_cpu_max_freq | int > 0

# The elevator= kernel command-line parameter was removed from the kernel
# around 5.3 (legacy single-queue I/O scheduler API removal) - it has no
# effect on any current kernel. It also required /etc/default/grub, which
# doesn't exist on Raspberry Pi OS or Ubuntu-on-Pi (both boot via
# flash-kernel/u-boot, not GRUB). A udev rule is the portable, modern
# mechanism: it works on any bootloader, takes effect immediately without a
# reboot, and is reapplied automatically for any matching device that's
# hot-added later.
- name: Configure I/O scheduler via udev rule
  ansible.builtin.template:
    src: 99-rpi-io-scheduler.rules.j2
    dest: /etc/udev/rules.d/99-rpi-io-scheduler.rules
    owner: root
    group: root
    mode: '0644'
  when: rpi_io_scheduler is defined
  notify: reload udev rules

- name: Configure TRIM for SD cards (weekly cron)
  ansible.builtin.cron:
    name: "SD Card TRIM"
    minute: "0"
    hour: "3"
    weekday: "0"
    job: "/sbin/fstrim -av"
    state: "{{ 'present' if rpi_fs_trim_enable | bool else 'absent' }}"

